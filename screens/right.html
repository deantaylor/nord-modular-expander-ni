<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* {box-sizing:border-box} body {margin:0;width:480px;height:272px;overflow:hidden;background:#111820;color:#f1f5f8;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
header {height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #34414c}
.logo{font-size:13px;letter-spacing:1.2px;color:#ff5057;font-weight:800} .righthead{font-size:13px;color:#a8b9c8}
.main{height:195px;padding:16px 18px} .section{font-size:12px;font-weight:700;color:#7ce4ca;letter-spacing:1.2px}
.patch{font-size:26px;font-weight:750;margin-top:9px;white-space:nowrap} .details{display:flex;gap:12px;margin-top:18px}
.tag{background:#223340;color:#d4e4ef;border-radius:5px;padding:9px 10px;font-size:12px;min-width:85px;text-align:center}
.footer{height:32px;border-top:1px solid #34414c;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#869dac;font-size:10px;white-space:nowrap;overflow:hidden}
.knobs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px;margin-top:9px} .knob{background:#1b2833;border:1px solid #324452;border-radius:9px;height:68px;text-align:center;padding:7px 3px} .klabel{font-size:9px;letter-spacing:.5px;color:#b8cbd8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .kvalue{font-size:18px;font-weight:750;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#80e6ce;font-variant-numeric:tabular-nums} .kbar{height:3px;background:#344a58;margin:5px 10px;border-radius:2px;overflow:hidden} .kfill{background:#ff5b67;height:100%;width:50%}
</style></head><body><header><span class="logo" id="engine">G1 MOCK / NO ENGINE</span><span class="righthead" id="slot">SLOT A</span></header><div class="main" id="main"></div><div class="footer"><span id="status">READY • DEMO PARAMETERS</span><span id="connection">MK3 / PROTOTYPE 0.1</span></div>
<script>
const SIDE='right';
let data={engine:'CONTROLLER STARTING',slot:'—',patch:'Waiting for backend',page:0,pageName:'WAITING',labels:Array(8).fill('—'),values:Array(8).fill(0),displayValues:Array(8).fill('—'),status:'No backend state received'};
function draw(){
 document.getElementById('engine').textContent=data.engine;
 document.getElementById('slot').textContent='SLOT '+data.slot;
 document.getElementById('status').textContent=data.status;
 if(data.connection)document.getElementById('connection').textContent=data.connection.status;
 const el=document.getElementById('main');
 if(SIDE==='left' && data.backend==='g1') {
  el.innerHTML='<div class="section">'+escapeText(data.pageName)+'</div><div style="font:17px monospace;line-height:22px;margin:8px 0">'+(data.lcd||[]).map(escapeText).join('<br>')+'</div><div style="font-size:10px;color:#a8b9c8;margin-bottom:4px">PATCHES · arrows browse · TOP 4 load · '+(data.banksComplete?'banks read':'reading banks…')+'</div>'+(data.browser||[]).map(p=>'<div style="font-size:12px;line-height:18px;color:'+(p.selected?'#80e6ce':'#a8b9c8')+'">'+(p.selected?'› ':'  ')+p.bank+' / '+p.position+' · '+escapeText(p.name)+'</div>').join('');
 } else if(SIDE==='left') {
  el.innerHTML='<div class="section">DEMO / NO ENGINE</div><div class="patch">'+escapeText(data.patch)+'</div><div class="details"><span class="tag">SLOT '+escapeText(data.slot)+'</span><span class="tag">'+escapeText(data.pageName)+'</span><span class="tag">PAGE '+(data.page+1)+'/'+(data.pageCount||1)+'</span></div><div style="font-size:11px;color:#a8b9c8;margin-top:12px;line-height:16px">TOP 4: next mock preset · GROUPS: modules<br>'+escapeText((data.presets||[]).map(p=>p.name).join(' / '))+'</div>';
 } else {
  el.innerHTML='<div class="section">'+escapeText(data.pageName)+' · PAGE '+(data.page+1)+'/'+(data.pageCount||3)+'</div><div class="knobs">'+data.labels.map((n,i)=>'<div class="knob"><div class="klabel">'+escapeText(n)+'</div><div class="kvalue">'+escapeText(data.displayValues?data.displayValues[i]:Math.round(data.values[i]*100)+'%')+'</div><div class="kbar"><div class="kfill" style="width:'+Math.round(data.values[i]*100)+'%"></div></div></div>').join('')+'</div>';
 }
}
function escapeText(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.encdr=window.encdr||{};
window.encdr.onMessage=function(channel,payload){if(channel==='state'){data=payload;draw()}};
draw();
</script></body></html>
